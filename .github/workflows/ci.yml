name: Botati CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a full commit SHA, with the release tag in a
      # trailing comment so Dependabot can bump both. A mutable tag like `@v4`
      # lets the upstream owner change what CI executes under our name.
      # SHAs resolved with `git ls-remote <repo> refs/tags/<tag>` on 2026-11-01.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Unit Tests (Gradle)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Guard — ChatRequestDto has a single construction site
        # §18/Q4: the provider field is required (no default), so every
        # request must go through LlmRequest.toDto. The declaration plus
        # that one call site are the only two matches; a third means a new
        # construction site is bypassing the routing decision.
        run: |
          count=$(grep -rn "ChatRequestDto(" app/src/main/java --include='*.kt' | wc -l)
          test "$count" -eq 2 || { echo "expected 2 ChatRequestDto( sites (declaration + toDto), found $count"; exit 1; }

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Room schema is in sync (BOT-18)
        # app/schemas/<db>/<version>.json is committed as the baseline a future
        # migration is written and verified against. After a build, KSP
        # regenerates the current version (which must match byte-for-byte) and
        # creates a NEW <version>.json whenever the schema version is bumped.
        # Either outcome leaves the tree dirty:
        #   modified  -> the entities changed and the baseline was not updated
        #   untracked -> a new schema version was generated and not committed
        # Both mean the committed baseline no longer describes the code, so both
        # fail. A first-generation warning branch existed only until the
        # baseline landed; keeping it would silently let `2.json` through.
        run: |
          SCHEMA_DIR=app/schemas/com.botati.data.db.BotatiDatabase
          if [ ! -d "$SCHEMA_DIR" ]; then
            echo "::error::no schema exported — check exportSchema and room.schemaLocation in app/build.gradle.kts"
            exit 1
          fi
          echo "Exported schemas:"; ls -1 "$SCHEMA_DIR"
          if [ -n "$(git status --porcelain -- "$SCHEMA_DIR")" ]; then
            echo "::error::Room schema is out of sync (modified, or a new version is untracked) — fetch the 'room-schema' artifact and commit app/schemas/"
            git status --porcelain -- "$SCHEMA_DIR"
            exit 1
          fi

      - name: Upload exported Room schema on failure
        # Only useful when the guard above FAILED: that means the schema changed
        # and was not committed, and the runner's filesystem is about to be
        # discarded. Uploading then lets the change be fetched with
        # `gh run download <run-id> -n room-schema` and committed verbatim.
        # On a green build the committed baseline already matches, so there is
        # nothing to upload and no artifact is produced.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Signing Secret Availability
        id: signing
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Fail — a release tag requires signing credentials
        # A `v*` tag IS a release. If the keystore secret is missing there, the
        # old workflow skipped both release steps and still reported success:
        # a green build with no signed APK, which is the worst possible outcome
        # for a release pipeline. Fail loudly instead of skipping quietly.
        # Branch pushes stay tolerant on purpose — a fork or a maintainer without
        # the secret must still be able to run the test suite.
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::${GITHUB_REF} is a release tag but SIGNING_KEYSTORE_BASE64 is not set — refusing to report a green build that produced no signed APK"
          exit 1

      - name: Warn — this build produces no signed APK
        # Not a failure on a branch push, but never silent either: the job is
        # green, and "green" must not be read as "a signed artifact exists".
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::SIGNING_KEYSTORE_BASE64 is not set — this run is unsigned. Tag pushes fail instead, so a release can never be silently unsigned."

      - name: Assemble & Verify Signed Release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH"

      - name: Upload Signed Release Artifact
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Derived from the ref, not hardcoded: a hardcoded version silently
          # mislabels every later release's artifact.
          name: botati-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
