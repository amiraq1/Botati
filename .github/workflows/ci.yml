name: Botati CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a full commit SHA, with the release tag in a
      # trailing comment so Dependabot can bump both. A mutable tag like `@v4`
      # lets the upstream owner change what CI executes under our name.
      # SHAs resolved with `git ls-remote <repo> refs/tags/<tag>` on 2026-11-01.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2

      - name: Run Unit Tests (Gradle)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Guard — ChatRequestDto has a single construction site
        # §18/Q4: the provider field is required (no default), so every
        # request must go through LlmRequest.toDto. The declaration plus
        # that one call site are the only two matches; a third means a new
        # construction site is bypassing the routing decision.
        run: |
          count=$(grep -rn "ChatRequestDto(" app/src/main/java --include='*.kt' | wc -l)
          test "$count" -eq 2 || { echo "expected 2 ChatRequestDto( sites (declaration + toDto), found $count"; exit 1; }

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Room schema export is committed (BOT-18)
        # exportSchema = true writes app/schemas/<db>/<version>.json during KSP.
        # That file is what a future migration is written and verified against,
        # so it has to be in the repo.
        #   - first run: the file is untracked -> warn, with the exact fix.
        #   - later: the schema CHANGED but was not committed -> fail.
        run: |
          SCHEMA_DIR=app/schemas/com.botati.data.db.BotatiDatabase
          if [ ! -d "$SCHEMA_DIR" ]; then
            echo "::warning::no Room schema exported — check room.schemaLocation in app/build.gradle.kts"
            exit 0
          fi
          echo "Exported schemas:"; ls -1 "$SCHEMA_DIR"
          if [ -n "$(git status --porcelain -- "$SCHEMA_DIR" | grep -v '^??')" ]; then
            echo "::error::Room schema changed but is not committed — commit app/schemas/ with the entity change"
            git status --porcelain -- "$SCHEMA_DIR"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- "$SCHEMA_DIR" | grep '^??')" ]; then
            echo "::warning::Room schema generated for the first time — commit app/schemas/ so migrations have a baseline"
            git status --porcelain -- "$SCHEMA_DIR"
          fi

      - name: Check Signing Secret Availability
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble & Verify Signed Release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH"

      - name: Upload Signed Release Artifact
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botati-0.1.5-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
