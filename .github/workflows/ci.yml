name: Botati CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (Gradle)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check Signing Secret Availability
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble & Verify Signed Release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH"

      - name: Upload Signed Release Artifact
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: botati-0.1.4-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
