version: 2

# BOT-21: keep dependencies and pinned action SHAs current without hand-editing.
#
# The workflow pins actions to full commit SHAs with the release tag in a
# trailing comment; Dependabot understands that convention and bumps both the
# SHA and the comment, which is the only way SHA-pinning stays maintainable.
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole AndroidX/Compose surface instead of fifteen.
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
